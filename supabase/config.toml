project_id = "igsdwvwiqnozgwczzycx"

[functions.drive-video]
# POST verifies the user JWT; GET/HEAD verify a short-lived media ticket.
verify_jwt = false

[auth]
enable_manual_linking = true
additional_redirect_urls = ["https://edu-study-app.vercel.app/**", "iskra://auth/callback"]

[auth.email.template.magic_link]
subject = "Код для входа в Искру"
content_path = "./supabase/templates/magic-link.html"

[functions.iskra-mcp]
# MCP OAuth discovery must be reachable before a user token exists. The Edge
# Function verifies the OAuth-issued bearer token itself with @supabase/server.
verify_jwt = false

[functions.testly-sync]
# Authenticated with the existing shared Testly bridge secret; never browser-facing.
verify_jwt = false

[functions.hw-grade-run]
# JWT is verified inside the handler; cron uses its shared secret.
verify_jwt = false


# User-approved MCP clients authenticate through the Iskra consent page.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.native-crash-webhook]
# HMAC-SHA256 verified against raw bytes inside the handler.
verify_jwt = false
[functions.incident-context]
# Timestamped HMAC; only a scoped technical allowlist leaves the private queue.
verify_jwt = false

[functions.feedback-triage]
# Cron authenticates with x-digest-secret; admin JWT is verified inside the handler.
verify_jwt = false

[functions.reminders-send]
# Крон reminders-dispatch (pg_net) зовёт без JWT; защита — x-reminders-secret.
verify_jwt = false

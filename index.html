<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA standalone: "Добавить на экран Домой" → полноэкранный режим без хрома
         Safari; статус-бар прозрачный, наши env(safe-area-inset-*) убирают полосы. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Искра" />
    <!-- theme-color matches the page bg exactly (per theme) so Safari's status/
         address bars blend with the content — no visible "fill" band. -->
    <meta name="theme-color" content="#F5F5F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" id="app-favicon" type="image/svg+xml" href="./icon.svg?v=2" />
    <!-- iOS ignores SVG apple-touch-icon → must be a PNG for a crisp home-screen icon. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Искра — Кабинет ученика</title>
    <!-- Слой мобильного дока живёт в <body>, снаружи разметки React: скрытие
         мобильной ветки через display:none у обёртки до портала не достаёт.
         Порог 1024 — тот же, по которому DashboardPage переключает разметку. -->
    <style>
      @media (min-width: 1024px) { #mobile-dock-layer { display: none !important } }
      /* Заглушка первого кадра — см. #boot в разметке ниже. */
      :root { --boot-bg: #F5F5F6; --boot-block: rgba(0,0,0,0.055) }
      html[data-theme="dark"] { --boot-bg: #111113; --boot-block: rgba(255,255,255,0.06) }
      html, body { background: var(--boot-bg) }
      #boot { max-width: 980px; margin: 0 auto; padding: 24px 20px 0 }
      #boot i { display: block; background: var(--boot-block); border-radius: 18px;
                animation: boot-pulse 1.6s ease-in-out infinite }
      @keyframes boot-pulse { 0%, 100% { opacity: .6 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none } }
    </style>
    <!-- Фавикон + заголовок переключаются по маршруту: ученик (книга) / учитель (искра).
         apple-touch-icon is intentionally NOT switched — iOS reads it once at add-time. -->
    <script>
      (function () {
        // Тема — до первой отрисовки. Стор ставит data-theme на монтировании, то
        // есть через секунды после начала загрузки, и всё это время тёмный
        // пользователь смотрел на белый экран.
        try {
          document.documentElement.setAttribute('data-theme',
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light')
        } catch (e) {}
        function syncIcon() {
          var teacher = location.hash.indexOf('#/teacher') === 0
          var href = teacher ? './icon-teacher.svg?v=2' : './icon.svg?v=2'
          var fav = document.getElementById('app-favicon')
          if (fav) fav.href = href
          // Заголовок вкладки — тоже интерфейс: язык берём там же, где его
          // держит приложение (localStorage 'lang'), до загрузки бандла.
          var en = false
          try { en = localStorage.getItem('lang') === 'en' } catch (e) {}
          document.title = teacher
            ? (en ? 'Iskra — teacher workspace' : 'Искра — Кабинет учителя')
            : (en ? 'Iskra — student workspace' : 'Искра — Кабинет ученика')
        }
        window.addEventListener('hashchange', syncIcon)
        // Смена языка в приложении перерисовывает и заголовок вкладки.
        window.__syncAppTitle = syncIcon
        syncIcon()
      })()
    </script>
    <!-- Microsoft Clarity: добавь VITE_CLARITY_ID в .env и пересобери, или вставь ID напрямую ниже -->
    <script>
      (function(c,l,a,r,i,t,y){
        var id = '%VITE_CLARITY_ID%'
        if (!id || id === '%VITE_CLARITY_ID%') return
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)}
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)
      })(window,document,"clarity","script","%VITE_CLARITY_ID%");
    </script>
  </head>
  <body>
    <!-- ЗАГЛУШКА ПЕРВОГО КАДРА.
         До неё #root был пуст, и экран оставался белым, пока не выполнится
         главный чанк — замер на проде: 3092 мс до первого пикселя при том, что
         сам HTML приезжал за 350 мс. Пользователь всё это время не мог отличить
         загрузку от сломанного сайта.
         Разметка самодостаточная (свои стили, без классов из index.css) и
         исчезает сама: createRoot().render() очищает контейнер. -->
    <div id="root">
      <div id="boot" aria-hidden="true">
        <i style="height:44px;width:min(340px,72vw);margin:0 auto;border-radius:22px"></i>
        <i style="height:26vh;min-height:150px;margin-top:38px"></i>
        <i style="height:88px;margin-top:16px"></i>
        <i style="height:88px;margin-top:16px;width:68%"></i>
      </div>
    </div>
    <!-- Нижний слой (док + навигация) живёт ЗДЕСЬ, а не в #root, и намеренно
         не position:fixed. На холодном запуске установленного PWA вебвью
         какое-то время держит вьюпорт короче экрана (замер на iPhone 16 Pro:
         innerHeight 812 при экране 874), а position:fixed обрезается ровно по
         этой ложной границе — навигация и стояла выше края, пока ученик не
         тронет экран. 100dvh при этом считается от полного экрана, поэтому
         обычный слой такой высоты садится на настоящий низ сразу.
         Слой создан прямо в разметке, чтобы портал нашёл его на первом же
         рендере и док не мигнул сначала не там. -->
    <div id="mobile-dock-layer"
         style="position:absolute; top:0; left:0; right:0; height:100dvh; z-index:50; pointer-events:none"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA standalone: "Добавить на экран Домой" → полноэкранный режим без хрома
         Safari; статус-бар прозрачный, наши env(safe-area-inset-*) убирают полосы. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Edu" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Edu Platform — Кабинет ученика</title>
    <!-- Microsoft Clarity: добавь VITE_CLARITY_ID в .env и пересобери, или вставь ID напрямую ниже -->
    <script>
      (function(c,l,a,r,i,t,y){
        var id = '%VITE_CLARITY_ID%'
        if (!id || id === '%VITE_CLARITY_ID%') return
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)}
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)
      })(window,document,"clarity","script","%VITE_CLARITY_ID%");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

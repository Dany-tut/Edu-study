name: Календарь — действия и данные
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  calendar:
    name: Выбор дня, недели и прокрутка
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:calendar-browser
        env:
          ISKRA_QA_OUTPUT: artifacts/calendar
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: calendar-browser
          path: artifacts/calendar

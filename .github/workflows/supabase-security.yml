# Советы безопасности Supabase по боевой базе
#
# Проверяет то, что видно только в живом Postgres: таблицы без RLS,
# SECURITY DEFINER-представления и прочие ошибки уровня ERROR из
# Supabase Security Advisor. Подробности — в scripts/checkSupabaseAdvisors.mjs.
#
# ПОЧЕМУ НЕ НА КАЖДЫЙ PR. Миграции применяются к базе отдельно от кода, так что
# прогон на PR смотрел бы на старую базу и ничего не говорил о самой ветке.
# Поэтому — каждый день, после push в main с правками supabase/ и вручную.
# Отдельный workflow, чтобы недоступность API Supabase не блокировала релизы.

name: Безопасность Supabase

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisors:
    name: Security Advisor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Советы безопасности (ERROR валит прогон)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checkSupabaseAdvisors.mjs

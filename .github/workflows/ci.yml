# Сторожа на каждый push
#
# ЗАЧЕМ. В репозитории уже лежат `tsc`, девять сторожей содержания и сборка —
# и до сих пор их запускал только человек, вспомнив об этом. Пока над проектом
# работает несколько сессий одновременно, «вспомнил» — не механизм: сломать
# чужое можно, ни разу не открыв сломанный файл, и узнать об этом через день.
# Этот workflow превращает набор команд в правило: не прошло — не в main.
#
# ЧТО ИМЕННО ГОНЯЕМ И ПОЧЕМУ ИМЕННО ТАК:
#   1. tsc --noEmit — типы. Первым, потому что дешевле всего отсеивает
#      опечатку в имени поля, до которой остальные проверки просто не дойдут.
#   2. Одиннадцать check:* — содержание. Каждый сторож ловит то, что НЕ ловит
#      сборка: слово без перевода, урок мимо стандарта, ответ, стоящий чаще
#      других на одной и той же позиции. Именно поэтому они и написаны — такие
#      поломки зелёной сборке не мешают.
#   3. build — последним. Он проверяет то, чего не видит tsc: что всё
#      действительно собирается в dist и Vercel не встанет на деплое.
#
# ПОЧЕМУ ВСЁ В ОДНОЙ ЗАДАЧЕ, А НЕ В ДЕСЯТИ ПАРАЛЛЕЛЬНЫХ. Полный прогон занимает
# около минуты, а установка зависимостей — дольше самих проверок. Десять задач
# поставили бы `npm ci` десять раз ради экономии секунд.
#
# ПОЧЕМУ ШАГИ НЕ ОБРЫВАЮТСЯ НА ПЕРВОМ ПАДЕНИИ (continue-on-error у сторожей).
# Уронить сборку должен ЛЮБОЙ красный сторож, но увидеть автор должен ВСЕ сразу:
# иначе починка десяти мелочей превращается в десять push-ей по кругу. Поэтому
# сторожа отмечаются как «упавшие», прогон идёт до конца, а итог подводится
# отдельным шагом в самом низу.
#
# ЧЕГО ЗДЕСЬ НЕТ. Деплоя: выкладывает Vercel по коммиту в main, и дублировать
# это здесь незачем. И правок в репозиторий — этот workflow только читает.

name: Проверки

on:
  push:
  pull_request:
  # Кнопка «прогнать сейчас» на вкладке Actions. Нужна не только для правок
  # самого workflow: GitHub изредка не заводит прогон на push, и без ручного
  # запуска коммит остаётся вообще без отметки — ни зелёной, ни красной.
  workflow_dispatch:

# Несколько сессий пушат в одну ветку подряд. Держать очередь из прогонов,
# каждый из которых уже неактуален, смысла нет — оставляем последний.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ничего не пишем — значит, и прав на запись не просим.
permissions:
  contents: read

jobs:
  checks:
    name: Типы, сторожа, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 24, а не 20, как у сборки ленты. На двадцатом нет встроенного
      # WebSocket, а check:choicepos бандлит исходники приложения вместе с
      # клиентом Supabase — тот на старте создаёт RealtimeClient и падает
      # ещё до первой проверки. Локально этого не видно: там Node 24.
      # Правило простое — версия в CI совпадает с той, на которой пишут.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Защита релизов (check:release)
        run: npm run check:release && npm run check:feed-release

      - name: Номера миграций не повторяются
        run: npm run check:migrations

      # ci, а не install: ставим ровно то, что в package-lock.json, иначе
      # «у меня работает» и «в CI падает» разъезжаются на минорных версиях.
      - name: Зависимости
        run: npm ci

      # Manual dispatch or an explicit release marker validates the candidate remotely.
      - name: Проверка кандидата выпуска
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-check]')
        run: npm run release:check

      - name: Связка трека и календаря
        run: npm run check:course-track && npm run check:schedule && npm run check:attendance

      - name: Диагностическая телеметрия (H1)
        run: npm run check:diagnostics

      - name: Серверный монитор и восстановление
        run: npm run check:server-monitor && npm run check:monitor-db

      - name: Типы (tsc --noEmit)
        id: types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Главная ученика (check:student-home)
        run: npm run check:student-home

      # ── Сторожа содержания ────────────────────────────────────────────────
      #
      # Порядок — от быстрых к медленным, чтобы дешёвая поломка всплывала в
      # логе раньше. Четыре последних гоняются через esbuild (они импортируют
      # исходники приложения), поэтому идут в конце.

      - name: Виды дневника (check:diary-views)
        run: npm run check:diary-views && npm run check:student-journal

      - name: Словарь слов (check:gloss)
        id: gloss
        continue-on-error: true
        run: npm run check:gloss

      - name: Английский интерфейс (check:i18n)
        id: i18n
        continue-on-error: true
        run: npm run check:i18n

      - name: Полнота и параллельная загрузка журнала
        run: npm run check:journal-loading && npm run check:journal-summary

      - name: Напоминания ученикам в Telegram (SQL и бот)
        run: npm run check:reminders

      - name: Изоляция личного учебного примера
        run: node scripts/checkPersonalStudentDemo.mjs

      - name: Просмотр кабинета преподавателя (check:teacher-view)
        run: npm run check:teacher-view

      - name: Переводы вопросов (check:questions)
        id: questions
        continue-on-error: true
        run: npm run check:questions

      - name: Конспекты (check:prose)
        id: prose
        continue-on-error: true
        run: npm run check:prose

      - name: Примеры к словам (check:examples)
        id: examples
        continue-on-error: true
        run: npm run check:examples

      - name: Сцены (check:scenes)
        id: scenes
        continue-on-error: true
        run: npm run check:scenes

      - name: Лента (check:feed)
        id: feed
        continue-on-error: true
        run: npm run check:feed

      - name: Методика (check:logic)
        id: logic
        continue-on-error: true
        run: npm run check:logic

      - name: Стандарт урока (check:lesson)
        id: lesson
        continue-on-error: true
        run: npm run check:lesson && npm run check:video-access

      - name: Позиции верных ответов (check:choicepos)
        id: choicepos
        continue-on-error: true
        run: npm run check:choicepos

      # Лёгкие таблицы (язык старых ссылок тренажёра) собираются скриптом из
      # данных. Разойтись они могут молча: присланная ссылка перестаёт открывать
      # материал, а сборка при этом зелёная.
      - name: Лёгкие таблицы (check:light)
        id: light
        continue-on-error: true
        run: npm run check:light

      - name: Назначения курса (check:course-access)
        id: courseaccess
        continue-on-error: true
        run: npm run check:course-access

      - name: Границы и покрытие иконок Loop
        run: npm run icons:check

      - name: Правила интерфейса (check:ui)
        run: npm run check:ui

      - name: Переходы и геометрия мини-виджета
        env:
          ISKRA_PLAYWRIGHT_MODULE: playwright
          ISKRA_BROWSER_CHANNEL: chromium
          ISKRA_QA_OUTPUT: /tmp/iskra-topbar-qa
          VITE_SUPABASE_URL: https://qa.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: qa-fixture-key
        run: |
          playwright_dir=$(mktemp -d)
          npm install --prefix "$playwright_dir" --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          ln -s "$playwright_dir/node_modules/playwright" node_modules/playwright
          "$playwright_dir/node_modules/.bin/playwright" install --with-deps chromium
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/iskra-topbar-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:student-topbar
          npm run check:calendar-browser
          npm run check:shelf-filters-browser
          ISKRA_QA_OUTPUT=/tmp/iskra-google-form-qa npm run check:google-form-modal
          ISKRA_BROWSER_CHANNEL=chromium node scripts/checkClaudeAccessRaces.mjs
          node scripts/checkOAuthConsentRaces.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: student-topbar-geometry
          path: |
            /tmp/iskra-topbar-qa/
            /tmp/iskra-calendar-day-qa/
            /tmp/iskra-shelf-filters/
            /tmp/iskra-google-form-qa/
          if-no-files-found: ignore

      # Сам поиск ключей идёт внутри `npm run build` по готовому dist/.
      # Здесь — проверка, что сторож вообще что-то ловит, а не молча зелёный.
      - name: Сторож ключей в клиенте (check:client-secrets)
        run: npm run check:client-secrets

      - name: Сборка
        id: build
        continue-on-error: true
        run: npm run build

      # ── Итог ───────────────────────────────────────────────────────────────
      #
      # Единственный шаг без continue-on-error: он и красит прогон. Печатает
      # табличку, чтобы не искать красный крестик по десятку свёрнутых шагов.
      - name: Итог
        run: |
          fail=0
          check () {
            if [ "$2" = "success" ]; then
              echo "✅ $1"
            else
              echo "❌ $1"
              fail=1
            fi
          }
          check "типы"                  "${{ steps.types.outcome }}"
          check "check:gloss"           "${{ steps.gloss.outcome }}"
          check "check:i18n"            "${{ steps.i18n.outcome }}"
          check "check:questions"       "${{ steps.questions.outcome }}"
          check "check:prose"           "${{ steps.prose.outcome }}"
          check "check:examples"        "${{ steps.examples.outcome }}"
          check "check:scenes"          "${{ steps.scenes.outcome }}"
          check "check:feed"            "${{ steps.feed.outcome }}"
          check "check:logic"           "${{ steps.logic.outcome }}"
          check "check:lesson"          "${{ steps.lesson.outcome }}"
          check "check:choicepos"       "${{ steps.choicepos.outcome }}"
          check "check:light"           "${{ steps.light.outcome }}"
          check "check:course-access"    "${{ steps.courseaccess.outcome }}"
          check "сборка"                "${{ steps.build.outcome }}"
          exit $fail

name: Искра — подготовить исправление
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iskra-incident-fix
  cancel-in-progress: false
jobs:
  propose:
    if: vars.ISKRA_AUTOFIX_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Ограниченный контекст без пользователей
        id: context
        env:
          ISKRA_PUBLISHABLE_KEY: ${{ vars.ISKRA_PUBLISHABLE_KEY }}
        run: node scripts/monitor/prepare-context.mjs
      - uses: actions/cache@v4
        id: attempted
        with:
          path: /tmp/iskra-attempt
          key: iskra-incident-attempt-${{ hashFiles('monitor-context.json') }}
      - name: Отметить попытку для этой ревизии
        if: steps.context.outputs.needed == 'true' && steps.attempted.outputs.cache-hit != 'true'
        run: mkdir -p /tmp/iskra-attempt && date -u > /tmp/iskra-attempt/at
      - name: Кандидат без прав публикации
        if: steps.context.outputs.needed == 'true' && steps.attempted.outputs.cache-hit != 'true'
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .github/prompts/incident-fix.md
      - name: Проверить наличие патча
        id: decision
        run: |
          if test -s /tmp/iskra-fix.patch && test "$(cat /tmp/iskra-fix-needed)" = true; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.decision.outputs.needed == 'true'
        with:
          name: iskra-candidate
          path: /tmp/iskra-fix.patch
          retention-days: 3
  draft:
    needs: propose
    if: needs.propose.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: iskra-candidate
          path: /tmp/iskra-candidate
      - name: Проверить патч и создать только draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISKRA_FIX_RUN: ${{ github.run_id }}
        run: node scripts/monitor/draft.mjs

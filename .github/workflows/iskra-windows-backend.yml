name: Windows isolated backend
on:
  push:
    branches: [qa/iskra-windows-beta]
    paths:
      - '.github/workflows/iskra-windows-backend.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Probe isolated Linux runtime on Windows
        run: |
          wsl --version
          wsl --install -d Ubuntu-24.04 --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl -d Ubuntu-24.04 -u root -- uname -a

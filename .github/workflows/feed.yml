# Ежедневная сборка ленты
#
# ЗАЧЕМ CI, А НЕ СЕРВЕР. Приложение — статический SPA на Vercel: своего бэкенда,
# который сходил бы за новостями, у него нет и не должно быть. Значит, лента
# обновляется в момент СБОРКИ, а не в момент открытия страницы. Раз так, нужен
# кто-то, кто раз в сутки эту сборку запускает, — вот он.
#
# ЦЕПОЧКА ЦЕЛИКОМ: cron → скрипт тянет источники → пишет src/data/feed/auto*.ts
# → ветка → полный CI → fast-forward main → Git-деплой Vercel. Ученик утром открывает
# «Ленту» и видит вчерашние и сегодняшние материалы; никто ничего не нажимал.
#
# ПОЧЕМУ КОММИТ, А НЕ АРТЕФАКТ. Лента должна быть воспроизводимой: по истории
# видно, что и когда попало на экран ученику, и любую заметку можно убрать
# обычным коммитом. Артефакт сборки такого следа не оставляет.
#
# ЧЕГО ЗДЕСЬ НЕТ. Автопубликации без единой проверки: перед коммитом гоняется
# `check:feed`, и если счётчики или реестр источников разошлись, сборка падает,
# а не выкладывает поломанную ленту.

name: Лента

on:
  schedule:
    # 04:30 UTC — раннее утро в Москве и глубокая ночь в Сеуле: к этому часу у
    # корейских и японских источников уже вышел утренний выпуск, а у
    # американских — вчерашний вечерний.
    - cron: '30 4 * * *'
  # Кнопка «прогнать сейчас» на вкладке Actions: пригождается каждый раз, когда
  # правишь список источников и не хочешь ждать до утра.
  workflow_dispatch:

# Пишем в репозиторий — значит, нужны права на запись.
permissions:
  contents: write
  actions: write

concurrency:
  group: feed-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Секрет поднят на уровень задачи не для удобства: `secrets` в условии шага
    # не читается, а `env` читается. Нет секрета — переменная пустая, и шаг с
    # пересказами просто не выполняется.
    #
    # ВТОРОЙ ВЫКЛЮЧАТЕЛЬ — В АДМИНКЕ. Ключ решает «можем ли мы вообще», флаги
    # app_flags (Администрирование → Обзор → «Расход на ИИ») — «нужно ли нам
    # сегодня». Их читают сами скрипты через scripts/aiFlag.mjs и молча выходят,
    # если рубильник опущен; здесь для этого ничего настраивать не надо.
    #
    # КЛЮЧЕЙ ДВА, И ГОДИТСЯ ЛЮБОЙ. ANTHROPIC_API_KEY — свой, прямой. KIE_API_KEY
    # — купленные кредиты шлюза kie.ai (тот же диалект Messages, свой адрес и
    # Bearer вместо x-api-key). Скрипты выбирают сами, шаги ниже ждут любой из
    # двух: пока условие проверяло только первый, ключ от шлюза лежал в
    # секретах функции, а перевод ленты не шёл ни разу.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Собрать ленту
        run: node scripts/buildFeed.mjs --write --limit 10

      # ── Пересказы по уровням ───────────────────────────────────────────────
      #
      # Шаг НЕОБЯЗАТЕЛЬНЫЙ и намеренно молчаливый: нет ключа в секретах — нет и
      # пересказов, а обычная лента собирается как собиралась. Ставить сборку
      # ленты в зависимость от чужого API нельзя: день без пересказа — мелочь,
      # день без ленты — пустой экран у ученика.
      #
      # `continue-on-error` по той же причине: отказ модели, таймаут или
      # исчерпанный лимит не должны отменять уже собранную ленту.
      # Зависимости ставятся ОТДЕЛЬНЫМ шагом, а не внутри пересказов: рубильники
      # в админке включаются по одному, и «перевод включён, пересказы выключены»
      # — обычное состояние. Пока npm ci жил внутри первого из двух шагов, такая
      # комбинация оставляла перевод без node_modules.
      - name: Зависимости для шагов с моделью
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.KIE_API_KEY != '' }}
        run: npm ci --no-audit --no-fund

      # ТОЛЬКО СВОЙ КЛЮЧ, НЕ ШЛЮЗ. Пересказ просит у модели вложенную структуру
      # (ступени лестницы) и полагается на структурный вывод по схеме. У шлюза
      # его нет — запрос упал бы, а `continue-on-error` этот отказ проглотил бы
      # молча. Именно так перевод и «работал» месяц: шаг пропускался, и никто не
      # видел. Появится свой ключ — пересказы включатся сами.
      - name: Пересказать по уровням
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/adaptFeed.mjs --write --limit 2

      # ── Перевод на русский ─────────────────────────────────────────────────
      #
      # Тот же необязательный шаг и по той же причине, что пересказы: без ключа
      # лента собирается как собиралась, только кнопка перевода в новых постах
      # показывает разбор по словам, а не перевод целиком. Лимит выше, чем у
      # пересказов: перевод — один запрос на материал, а за ночь их приходит
      # десяток на язык.
      - name: Перевести на русский
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.KIE_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/translateFeed.mjs --write --limit 60

      - name: Пересчитать счётчики
        run: node scripts/checkFeed.mjs --fix

      - name: Проверить
        run: node scripts/checkFeed.mjs

      # Сторож словаря СТОИТ ЗДЕСЬ, но не валит сборку. Лента приносит чужие
      # слова каждое утро, и падать из-за незнакомого имени собственного — это
      # выключить ленту, а не починить словарь. Зато в логе Actions видно, что
      # именно дописать руками.
      - name: Словарь к новым текстам
        continue-on-error: true
        run: npm run check:gloss

      - name: Закоммитить, если что-то изменилось
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain src/data/feed src/data/wordGlossAuto.ts)" ]; then
            echo "Ничего нового — источники молчали."
            exit 0
          fi
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          release_branch="codex/feed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Обновляем базу до коммита, чтобы штамп версии брался из свежего main.
          git stash push --include-untracked -- src/data/feed src/data/wordGlossAuto.ts
          git switch -c "$release_branch"
          git fetch origin main
          git rebase origin/main
          git stash pop
          git config core.hooksPath .githooks
          git add src/data/feed src/data/wordGlossAuto.ts
          git commit -m "chore(лента): материалы за $(date -u +%d.%m.%Y)"
          npm run release:check
          release_sha=$(git rev-parse HEAD)
          git push -u origin "$release_branch"
          # Push с GITHUB_TOKEN сам не запускает Actions; dispatch запускает CI.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
          run_id=''
          for attempt in {1..24}; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$release_branch" --commit "$release_sha" --event workflow_dispatch --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'CI не появился: main не обновлён, материалы сохранены в рабочей ветке.' >&2
            exit 1
          fi
          timeout 20m gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
          git fetch origin main
          npm run release:check
          # После CI SHA не меняем. При гонке обычный push остановится.
          git push origin HEAD:main
          git push origin --delete "$release_branch" || echo 'Релиз опубликован; рабочую ветку можно удалить позже.'

name: Mac transcription helper release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the notarized package to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: transcription-mac-release
  cancel-in-progress: false

jobs:
  build-and-notarize:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare signing keychain
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/iskra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign, notarize, and staple
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DEVELOPER_ID"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          test -n "$APPLE_NOTARY_PRIVATE_KEY"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          APPLE_NOTARY_PRIVATE_KEY="$KEY_PATH" bash scripts/buildTranscriptionMacInstaller.sh --release
          rm -f "$KEY_PATH"

      - name: Upload notarized installer for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: Iskra-Transcription-Mac-${{ github.sha }}
          path: .build/transcription-macos/Iskra-Transcription-Mac-v*.zip
          if-no-files-found: error

      - name: Publish versioned installer asset
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*= '\([^']*\)'.*/\1/p" src/lib/transcriptionInstallerVersion.ts | head -1)"
          PRODUCT_VERSION="$(sed -n "s/.*= '\([^']*\)'.*/\1/p" src/lib/transcriptionProductVersion.ts | head -1)"
          TAG="transcription-$VERSION"
          ASSET=".build/transcription-macos/Iskra-Transcription-Mac-v$PRODUCT_VERSION.zip"
          test -f "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Искра — Расшифровка v$PRODUCT_VERSION" \
              --notes "Подписанное и нотариально заверенное приложение Искры для расшифровки на Mac. Версия $PRODUCT_VERSION; сборка $VERSION."
          fi

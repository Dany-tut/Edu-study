# Dependabot: обновления зависимостей
#
# Security-обновления (PR при уязвимости) включены в настройках репозитория и
# приходят независимо от этого файла. Здесь — плановые обновления версий.
#
# Раз в неделю и одним сгруппированным PR, а не россыпью: в репозитории работает
# несколько сессий одновременно, и десяток мелких PR в день только мешает.
# Мажорные версии не группируются — их надо смотреть по одной.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']

<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#0d0d10;padding:10px;font:12px system-ui;color:#999">
<div id="out" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script>
const INK_DARK = '#3B2A63', INK_LIGHT = '#E8E2FA', INK = '#B9A8E8'

function scallop(ctx, cx, cy, r, lobes, depth) {
  ctx.beginPath()
  const steps = lobes * 24
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2 - Math.PI / 2
    const rr = r * (1 - depth + depth * Math.cos(a * lobes) * 0.5 + depth * 0.5)
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
  }
  ctx.closePath()
}
function star(ctx, x, y, r, fill) {
  ctx.save(); ctx.translate(x, y); ctx.beginPath()
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * 0.46 : r
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore()
}

// диамант: crown сверху (top), girdle (широкая линия) на gy, остриё внизу (bot)
const gem = (top, gy, bot, halfTop, halfG) => ctx => {
  ctx.beginPath()
  ctx.moveTo(-halfTop, top); ctx.lineTo(halfTop, top); ctx.lineTo(halfG, gy)
  ctx.lineTo(0, bot); ctx.lineTo(-halfG, gy); ctx.closePath(); ctx.fill()
  ctx.strokeStyle = INK_LIGHT; ctx.lineWidth = 0.1
  ctx.beginPath()
  ctx.moveTo(-halfG, gy); ctx.lineTo(halfG, gy)
  ctx.moveTo(-halfTop, top); ctx.lineTo(-halfTop * 0.565, gy); ctx.lineTo(0, bot)
  ctx.moveTo(halfTop, top); ctx.lineTo(halfTop * 0.565, gy)
  ctx.stroke()
}
const bigStar = ctx => star(ctx, 0, 0, 1.02, INK_DARK)
const trophy = ctx => {
  ctx.beginPath()
  ctx.moveTo(-0.52, -0.78); ctx.lineTo(0.52, -0.78); ctx.lineTo(0.44, -0.12)
  ctx.bezierCurveTo(0.4, 0.2, -0.4, 0.2, -0.44, -0.12); ctx.closePath(); ctx.fill()
  ctx.lineWidth = 0.16; ctx.strokeStyle = INK_DARK
  ctx.beginPath(); ctx.arc(-0.62, -0.44, 0.28, Math.PI * 0.55, Math.PI * 1.5); ctx.stroke()
  ctx.beginPath(); ctx.arc(0.62, -0.44, 0.28, Math.PI * 1.5, Math.PI * 0.45); ctx.stroke()
  ctx.beginPath(); ctx.rect(-0.12, 0.16, 0.24, 0.42); ctx.fill()
  ctx.beginPath(); ctx.rect(-0.46, 0.58, 0.92, 0.22); ctx.fill()
}

function seal(draw, title, px = 290) {
  const wrap = document.createElement('div')
  const canvas = document.createElement('canvas')
  canvas.width = canvas.height = px
  const ctx = canvas.getContext('2d')
  const c = px / 2, R = px * 0.46
  scallop(ctx, c, c, R, 14, 0.075)
  const body = ctx.createLinearGradient(0, c - R, 0, c + R)
  body.addColorStop(0, '#fff'); body.addColorStop(0.55, INK_LIGHT); body.addColorStop(1, INK)
  ctx.fillStyle = body; ctx.fill()
  ctx.beginPath(); ctx.arc(c, c, R * 0.88, 0, 7); ctx.strokeStyle = INK; ctx.lineWidth = px * 0.016; ctx.stroke()
  ctx.beginPath(); ctx.arc(c, c, R * 0.8, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = px * 0.008; ctx.stroke()
  const dy = c - px * 0.02
  ctx.beginPath(); ctx.arc(c, dy, R * 0.58, 0, 7)
  const disc = ctx.createRadialGradient(c - R * 0.2, c - R * 0.3, R * 0.05, c, dy, R * 0.58)
  disc.addColorStop(0, '#fff'); disc.addColorStop(1, 'rgba(255,255,255,.72)')
  ctx.fillStyle = disc; ctx.fill()
  ctx.save(); ctx.translate(c, dy); ctx.scale(R * 0.36, R * 0.36)
  ctx.fillStyle = INK_DARK; ctx.strokeStyle = INK_DARK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'
  draw(ctx); ctx.restore()
  for (let i = 0; i < 5; i++) {
    const a = Math.PI / 2 + (i - 2) * 0.235
    star(ctx, c + Math.cos(a) * R * 0.7, c + Math.sin(a) * R * 0.7, px * 0.036, INK_DARK)
  }
  wrap.appendChild(canvas)
  const cap = document.createElement('div')
  cap.textContent = title; cap.style.textAlign = 'center'
  wrap.appendChild(cap)
  document.getElementById('out').appendChild(wrap)
}

seal(bigStar, 'star (эталон)')
seal(trophy, 'trophy (эталон)')
seal(gem(-0.84, -0.31, 0.84, 0.69, 1.1), 'A — сейчас в проде')
seal(gem(-0.74, -0.21, 0.94, 0.69, 1.1), 'B — ниже на 0.10')
seal(gem(-0.66, -0.13, 1.02, 0.69, 1.1), 'C — ниже на 0.18')
seal(gem(-0.78, -0.16, 0.9, 0.66, 1.06), 'D — короче корона')
</script>
</body>

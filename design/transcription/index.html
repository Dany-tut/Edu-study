<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Искра · Расшифровка урока</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1f5;color:#252234;font:15px/1.45 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:1216px;padding:48px 40px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #cecad9;padding-bottom:24px;margin-bottom:26px}h1{margin:8px 0 0;font-size:44px;letter-spacing:-2px;line-height:1.09}header small,.caption{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#706982}header aside{font-weight:650;color:#666078}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{display:flex;flex-direction:column}.caption{padding:0 3px 9px}.card{border:1px solid #e1dee8;border-radius:22px;background:#fff;padding:24px;flex:1;box-shadow:0 4px 14px #28204008;display:flex;flex-direction:column;align-items:stretch;gap:12px}.top,.row,.pill,.bar{display:flex;align-items:center;gap:12px}.top{margin-bottom:2px}.wave{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:13px;color:#5846b4;background:#ece8ff}.wave svg{width:23px;height:23px}.top b{font-size:19px;letter-spacing:-.45px}p,small{margin:0;color:#696678}.cta,.soft,.seg span,.tag{font-weight:650;border-radius:11px;padding:10px 14px}.cta{text-align:center;background:#604ac1;color:white;margin-top:auto}.soft{background:#eeeaff;color:#514098;text-align:center}.tag{margin-left:auto;color:#276645;background:#e5f4e9;font-size:12px;padding:4px 10px}.seg{display:flex;gap:3px;background:#f0eff4;padding:4px;border-radius:13px}.seg span{text-align:center;flex:1;padding:6px;font-size:13px;color:#716c80}.seg .on{background:white;color:#5039a1;box-shadow:0 1px 4px #25213314}.field,.drop{border:1px solid #dcd8e5;border-radius:11px;padding:10px 13px}.drop{text-align:center;background:#f6f3ff;border:1px dashed #9d8bcf}.row{justify-content:space-between}.eyebrow{font-size:12px;font-weight:650;color:#716687}.lesson{background:#f6f5f8;padding:13px;border-radius:15px}.bar{position:relative;isolation:isolate;overflow:hidden;border-radius:10px;background:#f4f3f6;padding:8px 12px;color:#726e7e;font-size:13px}.bar.active{color:#473387;background:#efebfb;font-weight:700}.bar.active:before{content:'';position:absolute;inset:0 auto 0 0;width:var(--fill);background:#c5b8f4;z-index:-1}.bar i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffffffbf;font-size:11px}.bar b{margin-left:auto}.bars{display:grid;gap:4px}.warn{padding:12px;border-radius:12px;background:#fcf0ea;color:#864027}.chapter{display:flex;align-items:baseline;gap:14px;border-top:1px solid #eae7ee;padding-top:8px}.chapter time{color:#614bae;font-size:12px;font-weight:700}button{cursor:pointer}.scrub{appearance:none;width:100%;accent-color:#6751ba}.demo{display:flex;gap:12px;align-items:center;font-size:12px;color:#686272}.demo button{font:inherit;border:0;background:#eeeaff;color:#483589;border-radius:8px;padding:6px 10px}.chapter p{font-size:13px}@media(max-width:720px){main{padding:26px 15px}section{grid-template-columns:1fr}h1{font-size:32px}header aside{display:none}.card{padding:18px}}
</style><main><header><div><small>Искра &nbsp; / &nbsp; Конструктор курса</small><h1>Расшифровка урока</h1></div><aside>От подключения до публикации</aside></header><section id="board"></section></main><script>
const wave='<span class="wave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 10v4m5-8v12m5-16v20m5-17v14m5-10v6"/><path stroke="#f39a46" d="M12 2v2"/></svg></span>';
const heading=(title,tag='')=>'<div class="top">'+wave+'<b>'+title+'</b>'+ (tag?'<span class="tag">'+tag+'</span>':'')+'</div>';
const seg=f=>'<div class="seg"><span class="'+(!f?'on':'')+'">По ссылке</span><span class="'+(f?'on':'')+'">Из файла</span></div>';
const screens=[
['Модули · подключение',heading('Расшифровка уроков')+'<p>Превратите запись занятия в текст с главами. Обработка проходит на вашем Mac.</p><div class="field"><b>Сначала запустите модуль на Mac</b><br><small>Затем подключите этот компьютер к Искре.</small></div><div class="cta">Подключить компьютер</div>'],
['Урок · модуль подключён','<div class="eyebrow">Биология клетки / Урок 1</div><div class="seg"><span>Урок</span><span class="on">Запись</span><span>Домашки</span></div><div class="lesson">'+heading('Расшифровка урока','Доступна')+'<p>Получите текст и главы из записи урока.</p></div><div class="soft">Расшифровать запись</div>'],
['Источник · ссылка',heading('Расшифровка урока')+seg(false)+'<div><small>Ссылка на запись</small><div class="field">https://disk.yandex.ru/i/biology-01</div></div><p>Текст и главы можно проверить перед добавлением.</p><div class="cta">Начать расшифровку</div>'],
['Источник · файл',heading('Расшифровка урока')+seg(true)+'<div class="drop"><b>Биология клетки.mp4</b><br><small>148 МБ · Выбрать другой файл</small></div><small>Ссылка для учеников (необязательно)</small><div class="field">https://</div><div class="cta">Начать расшифровку</div>'],
['Обработка · прогресс внутри строки',heading('Готовим расшифровку')+'<div class="bars">'+['Видео подготовлено','Распознаём речь','Читаем слайды','Собираем главы'].map((x,i)=>'<div class="bar '+(i===1?'active':'')+'" style="--fill:14%"><i>'+[ '✓',2,3,4][i]+'</i>'+x+(i===1?'<b id="pct">14%</b>':'')+'</div>').join('')+'</div><div class="row"><small id="dur">1:30 из 10:54 записи</small><span class="demo"><button id="play">Показать движение</button></span></div>'],
['Восстановление · ошибка',heading('Не удалось открыть запись')+'<div class="warn"><b>Запись недоступна по ссылке</b><br>Проверьте доступ к видео или выберите файл на компьютере.</div><div class="field">https://disk.yandex.ru/i/biology-01</div><div class="soft">Изменить источник</div>'],
['Проверка · главы и реплики',heading('Проверьте расшифровку','Готово')+'<div class="eyebrow">Главы</div><div class="chapter"><time>00:00</time><b>Клетка как система</b></div><div class="chapter"><time>03:18</time><b>Как работает мембрана</b></div><div class="eyebrow">Реплики</div><div class="chapter"><time>00:06</time><p>Сегодня разберём, как клетка обменивается веществами со средой.</p></div><div class="cta">Добавить в черновик</div>'],
['Урок · результат',heading('Расшифровка урока','Добавлена')+'<p>Биология клетки · 10:54</p><div class="lesson"><div class="eyebrow">Главы записи</div><div class="chapter"><time>00:00</time>Клетка как система</div><div class="chapter"><time>03:18</time>Как работает мембрана</div></div><div class="soft">Открыть расшифровку</div>']
];board.innerHTML=screens.map(([name,html],i)=>'<article><div class="caption">0'+(i+1)+' &nbsp;/&nbsp; '+name+'</div><div class="card">'+html+'</div></article>').join('');
play.onclick=()=>{play.disabled=true;let t=90;const tick=setInterval(()=>{t=Math.min(654,t+7);let p=Math.round(t/654*100);pct.textContent=p+'%';pct.parentElement.style.setProperty('--fill',p+'%');dur.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+' из 10:54 записи';if(t===654){clearInterval(tick);play.disabled=false;play.textContent='Ещё раз'}},60)};
</script></html>
